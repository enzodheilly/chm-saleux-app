# config/services.yaml
parameters:
    # 🖼️ Dossier d'upload pour les images
    upload_dir: "%kernel.project_dir%/public/uploads"
    competitions_upload_dir: "%kernel.project_dir%/public/uploads/competitions"
    images_directory: "%kernel.project_dir%/public/uploads"
    machines_directory: "%kernel.project_dir%/public/uploads/machines"
    uploads_directory: "%kernel.project_dir%/public/uploads"

services:
    # ============================================================
    # ⚙️ CONFIGURATION PAR DÉFAUT
    # ============================================================
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $projectDir: "%kernel.project_dir%"

    # ============================================================
    # 📦 AUTO-DÉCOUVERTE DES SERVICES DU DOSSIER SRC/
    # ============================================================
    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Migrations/"
            - "../src/Tests/"
            - "../src/Kernel.php"

    # ============================================================
    # 🔐 AUTHENTICATOR PERSONNALISÉ (formulaire de connexion)
    # ============================================================
    App\Authenticator\LoginFormAuthenticator:
        arguments:
            $router: "@router"
            $passwordHasher: "@security.user_password_hasher"
            $userRepository: '@App\Repository\UserRepository'
            $entityManager: "@doctrine.orm.entity_manager"

    # ============================================================
    # 🧠 LISTENER : ENREGISTRE LES TENTATIVES DE CONNEXION
    # ============================================================
    App\EventListener\LoginAttemptListener:
        tags:
            - {
                  name: kernel.event_listener,
                  event: Symfony\Component\Security\Core\Event\AuthenticationFailureEvent,
                  method: onAuthenticationFailure,
              }
            - {
                  name: kernel.event_listener,
                  event: Symfony\Component\Security\Http\Event\InteractiveLoginEvent,
                  method: onInteractiveLogin,
              }
            - {
                  name: kernel.event_listener,
                  event: kernel.request,
                  method: checkSessionContext,
              }

    # ============================================================
    # 📬 AUTRES SERVICES PERSONNALISÉS
    # ============================================================
    # Exemple :
    # App\Service\MailService: ~

    # ============================================================
    # 🧱 CLOUDFLARE TURNSTILE - VERIFICATION CAPTCHA
    # ============================================================
    App\Service\TurnstileVerifierService:
        arguments:
            $secretKey: "%env(TURNSTILE_SECRET_KEY)%"
