imports:
    - { resource: "faq.yaml" }

parameters:
    upload_dir: "%kernel.project_dir%/public/uploads"
    competitions_upload_dir: "%kernel.project_dir%/public/uploads/competitions"
    images_directory: "%kernel.project_dir%/public/uploads"
    machines_directory: "%kernel.project_dir%/public/uploads/machines"
    uploads_directory: "%kernel.project_dir%/public/uploads"
    # Documents sensibles (certificats médicaux, justificatifs) : HORS du dossier public,
    # servis uniquement via une route admin protégée (voir AdminDemandeLicenceController).
    licence_documents_dir: "%kernel.project_dir%/var/private_uploads/licences"
    env(TURNSTILE_SITE_KEY): ""
    env(HELLOASSO_CLIENT_ID): ""
    env(HELLOASSO_CLIENT_SECRET): ""
    env(HELLOASSO_ORGANIZATION_SLUG): ""
    env(HELLOASSO_API_BASE_URL): "https://api.helloasso.com"

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $projectDir: "%kernel.project_dir%"
            $faqs: "%faq%"
            $maintenanceBypassToken: "%env(MAINTENANCE_BYPASS_TOKEN)%"
            $licenceDocumentsDir: "%licence_documents_dir%"

            $registerLimiter: "@limiter.register"
            $loginLimiter: "@limiter.login"
            $verifyCodeLimiter: "@limiter.verify_code"
            $resendCodeLimiter: "@limiter.resend_code"
            $resetRequestLimiter: "@limiter.reset_request"
            $resetFinalLimiter: "@limiter.reset_final"
            $setPasswordLimiter: "@limiter.set_password"
            $googleOauthCheckLimiter: "@limiter.google_oauth_check"
            $uploadPhotoLimiter: "@limiter.upload_photo"
            $boiteAIdeesLimiter: "@limiter.boite_a_idees"
            $licenceLinkLimiter: "@limiter.licence_link"

    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Migrations/"
            - "../src/Tests/"
            - "../src/Kernel.php"

    App\EventListener\LoginAttemptListener:
        tags:
            - {
                  name: kernel.event_listener,
                  event: Symfony\Component\Security\Http\Event\LoginFailureEvent,
                  method: onLoginFailure,
              }
            - {
                  name: kernel.event_listener,
                  event: Symfony\Component\Security\Http\Event\LoginSuccessEvent,
                  method: onLoginSuccess,
              }
            - {
                  name: kernel.event_listener,
                  event: kernel.request,
                  method: checkSessionContext,
              }

    App\Service\TurnstileVerifierService:
        arguments:
            $secretKey: "%env(TURNSTILE_SECRET_KEY)%"

    # ============================================================
    # SESSION EXPIRÉE
    # ============================================================
    App\EventListener\SessionExpiredListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    # ============================================================
    # GEO BLOCKER + VPN BLOCKER
    # ============================================================
    App\Security\GeoBlocker:
        arguments:
            $allowedCountry: "%env(string:GEO_ALLOWED_COUNTRY)%"
            $blockVpn: "%env(bool:GEO_BLOCK_VPN)%"

    # ============================================================
    # SECURITY LOG SUBSCRIBER
    # ============================================================
    App\EventSubscriber\SecurityLogSubscriber:
        arguments:
            $adminEmail: "%env(ADMIN_ALERT_EMAIL)%"
            $adminSiteUrl: "%env(ADMIN_SITE_URL)%"

    # ============================================================
    # HELLOASSO (paiement en ligne des licences)
    # ============================================================
    App\Service\HelloAssoService:
        arguments:
            $clientId: "%env(HELLOASSO_CLIENT_ID)%"
            $clientSecret: "%env(HELLOASSO_CLIENT_SECRET)%"
            $organizationSlug: "%env(HELLOASSO_ORGANIZATION_SLUG)%"
            $apiBaseUrl: "%env(HELLOASSO_API_BASE_URL)%"
