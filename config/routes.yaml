controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# ✅ LA ROUTE SPÉCIALE MOBILE
# C'est ici que l'appli va envoyer email + mot de passe.
# Pas besoin de créer de Controller PHP, le bundle de sécurité l'intercepte automatiquement !
api_login_check:
    path: /api/login_check
    methods: ["POST"]

# Redirection ancienne URL séance d'essai → nouvelle URL
admin_seance_essai_legacy:
    path: /gestion-chm-secrete-92x/seances-essai
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: admin_seance_essai_index
        permanent: true
