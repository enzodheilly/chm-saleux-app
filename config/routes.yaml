# config/routes.yaml

controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Tu peux garder ceux-là s'ils ne sont pas définis dans le PHP
app_legal:
    path: /mentions-legales
    controller: App\Controller\PageController::legal

app_privacy:
    path: /confidentialite
    controller: App\Controller\PageController::privacy

# ❌ SUPPRIME TOUT LE RESTE EN DESSOUS (admin_dashboard, admin_users, etc.)
# C'est ton code PHP (les #[Route]) qui va maintenant gérer ces adresses.
