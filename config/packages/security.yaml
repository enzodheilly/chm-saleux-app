# config/packages/security.yaml
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            login_throttling:
                max_attempts: 3
                interval: "15 minutes"

            custom_authenticators:
                - App\Authenticator\LoginFormAuthenticator
                - App\Security\GoogleAuthenticator
            entry_point: App\Authenticator\LoginFormAuthenticator

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true

            # ✅ SÉCURITÉ #2 : Double Authentification (Version compatible)
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check

            logout:
                path: app_logout
                target: /

            remember_me:
                secret: "%kernel.secret%"
                lifetime: 604800
                path: /
                always_remember_me: false
                name: REMEMBERME

            stateless: false

    access_control:
        - { path: ^/2fa, role: PUBLIC_ACCESS }
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/admin/security/setup-2fa/success, roles: ROLE_ADMIN }
        - { path: ^/admin/security/blocklist/ban-ip, roles: ROLE_ADMIN }
        - { path: ^/admin/security/purge, roles: ROLE_ADMIN }
        - { path: ^/gestion-chm-secrete-92x, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
