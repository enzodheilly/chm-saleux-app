# config/packages/security.yaml
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # ✅ SÉCURITÉ #1 : Anti Brute-Force (Limitation des tentatives)
            login_throttling:
                max_attempts: 3
                interval: "15 minutes"

            custom_authenticators:
                - App\Authenticator\LoginFormAuthenticator
                - App\Security\GoogleAuthenticator
            entry_point: App\Authenticator\LoginFormAuthenticator

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true

            # ✅ SÉCURITÉ #2 : Double Authentification (2FA)
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check

            logout:
                path: app_logout
                target: /

            remember_me:
                secret: "%kernel.secret%"
                lifetime: 604800
                path: /
                always_remember_me: false
                name: REMEMBERME

            stateless: false

    # ✅ SÉCURITÉ #3 : Hiérarchie et Contrôle d'Accès
    access_control:
        # --- Routes Publiques ---
        - { path: ^/2fa, role: PUBLIC_ACCESS }
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }

        # --- Espace Membre (Utilisateurs connectés) ---
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_USER }

        # --- Sécurité Administration (Routes sensibles) ---
        # On protège spécifiquement les actions de bannissement et de purge
        - { path: ^/admin/security/blocklist/ban-ip, roles: ROLE_ADMIN }
        - { path: ^/admin/security/purge, roles: ROLE_ADMIN }

        # Protection de ton URL secrète personnalisée
        - { path: ^/gestion-chm-secrete-92x, roles: ROLE_ADMIN }

        # Protection globale du reste de l'admin
        - { path: ^/admin, roles: ROLE_ADMIN }

    # Optionnel : permet de définir que l'ADMIN a aussi les droits du USER
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
