security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # ✅ 1. LE GUICHET D'ENTRÉE MOBILE (Récupérer le Token + Refresh Token)
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
                username_path: email
                password_path: password

        # ✅ 2. LE GUICHET DE RENOUVELLEMENT (Échanger Refresh Token contre Token)
        # C'est ici que l'appli viendra quand son Token est périmé
        api_token_refresh:
            pattern: ^/api/token/refresh
            stateless: true
            refresh_jwt:
                check_path: /api/token/refresh

        # ✅ 3. LA ZONE VIP MOBILE (Accès aux données)
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        # ✅ 4. LE SITE WEB CLASSIQUE
        main:
            lazy: true
            provider: app_user_provider

            # Important : Le pattern permet d'éviter que 'main' n'essaie de gérer l'API
            # pattern: ^/

            login_throttling:
                max_attempts: 3
                interval: "15 minutes"

            custom_authenticators:
                - App\Authenticator\LoginFormAuthenticator
                - App\Security\GoogleAuthenticator
            entry_point: App\Authenticator\LoginFormAuthenticator

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true

            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check

            logout:
                path: app_logout
                target: /

            remember_me:
                secret: "%kernel.secret%"
                lifetime: 604800
                path: /
                always_remember_me: false
                name: REMEMBERME

            stateless: false

    access_control:
        # --- RÈGLES API ---
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS } # 👈 Indispensable : il faut pouvoir rafraîchir sans être connecté
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

        # --- RÈGLES SITE WEB ---
        - { path: ^/2fa, role: PUBLIC_ACCESS }
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_ADMIN }

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
