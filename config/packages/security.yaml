security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
                username_path: email
                password_path: password

        api_token_refresh:
            pattern: ^/api/token/refresh
            stateless: true
            refresh_jwt:
                check_path: /api/token/refresh

        # API public pour les actualités
        api_public_actus:
            pattern: ^/api/actus(?:/|$)
            stateless: true
            security: false

        # Toutes les autres routes API protégées par JWT
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            stateless: false

            user_checker: App\Security\UserChecker

            login_throttling:
                max_attempts: 3
                interval: "15 minutes"

            custom_authenticators:
                - App\Authenticator\LoginFormAuthenticator
                - App\Security\GoogleAuthenticator

            entry_point: App\Authenticator\LoginFormAuthenticator

            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check

            logout:
                path: app_logout
                target: /
                invalidate_session: true
                delete_cookies:
                    REMEMBERME: ~

            remember_me:
                secret: "%kernel.secret%"
                lifetime: 604800
                path: /
                always_remember_me: false
                name: REMEMBERME
                secure: auto
                httponly: true
                samesite: lax

    access_control:
        # --- API public ---
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check$, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password-final$, roles: PUBLIC_ACCESS }

        # Actus publiques
        - { path: ^/api/actus(?:/|$), roles: PUBLIC_ACCESS }

        # --- API privée ---
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

        # --- Web public ---
        - { path: ^/connexion/verification, roles: PUBLIC_ACCESS }
        - { path: ^/connexion/google, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/inscription$, roles: PUBLIC_ACCESS }
        - { path: ^/mot-de-passe-oublie, roles: PUBLIC_ACCESS }
        - { path: ^/verification/email, roles: PUBLIC_ACCESS }

        # --- Web privé ---
        - { path: ^/set-password, roles: ROLE_USER }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/espace-adherent, roles: ROLE_USER }
        - { path: ^/compte, roles: ROLE_USER }

        # Accès panel admin (staff + super admin)
        - { path: ^/gestion-chm-secrete-92x, roles: ROLE_STAFF }

    role_hierarchy:
        ROLE_STAFF: [ROLE_USER]
        ROLE_SUPER_ADMIN: [ROLE_STAFF, ROLE_ALLOWED_TO_SWITCH]
