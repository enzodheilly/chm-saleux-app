framework:
    rate_limiter:
        register:
            policy: "fixed_window"
            limit: 10
            interval: "10 minutes"

        login:
            policy: "sliding_window"
            limit: 10
            interval: "10 minutes"

        verify_code:
            policy: "fixed_window"
            limit: 10
            interval: "10 minutes"

        resend_code:
            policy: "fixed_window"
            limit: 3
            interval: "3 minutes"

        reset_request:
            policy: "fixed_window"
            limit: 5
            interval: "30 minutes"

        reset_final:
            policy: "fixed_window"
            limit: 5
            interval: "30 minutes"

        set_password:
            policy: "fixed_window"
            limit: 10
            interval: "30 minutes"
