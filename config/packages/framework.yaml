framework:
    secret: "%env(APP_SECRET)%"

    # Cloudflare proxies — plages IP officielles (https://www.cloudflare.com/ips/)
    trusted_proxies: '173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32'
    trusted_headers: [ "x-forwarded-for", "x-forwarded-proto", "x-forwarded-port", "x-forwarded-host" ]

    session:
        enabled: true
        handler_id: null
        cookie_httponly: true
        cookie_secure: auto
        cookie_samesite: lax
        # ✅ session 7 jours
        cookie_lifetime: 604800
        gc_maxlifetime: 604800

    # ============================================================
    # ✅ RATE LIMITERS (si tu utilises framework.rate_limiter)
    # ============================================================
    rate_limiter:
        register:
            policy: "fixed_window"
            limit: 10
            interval: "10 minutes"

        login:
            policy: "sliding_window"
            limit: 20
            interval: "10 minutes"

        verify_code:
            policy: "fixed_window"
            limit: 10
            interval: "10 minutes"

        resend_code:
            policy: "fixed_window"
            limit: 3
            interval: "30 minutes"

        reset_request:
            policy: "fixed_window"
            limit: 5
            interval: "30 minutes"

        reset_final:
            policy: "fixed_window"
            limit: 5
            interval: "30 minutes"

        set_password:
            policy: "fixed_window"
            limit: 10
            interval: "30 minutes"

        # ✅ OAuth Google callback flood protection
        google_oauth_check:
            policy: "fixed_window"
            limit: 20
            interval: "10 minutes"

        upload_photo:
            policy: "fixed_window"
            limit: 10
            interval: "10 minutes"

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
