framework:
    secret: "%env(APP_SECRET)%"

    # ✅ (Recommandé) Si tu es derrière Cloudflare / nginx reverse proxy,
    # active ceci (sinon getClientIp() / rate-limit / logs = faux)
    # trusted_proxies: "%env(TRUSTED_PROXIES)%"
    # trusted_headers: [ "x-forwarded-for", "x-forwarded-proto", "x-forwarded-port", "x-forwarded-host" ]

    session:
        enabled: true
        handler_id: null

        cookie_httponly: true
        cookie_secure: auto
        cookie_samesite: lax

        # ✅ session 7 jours
        cookie_lifetime: 604800
        gc_maxlifetime: 604800

    # ============================================================
    # ✅ RATE LIMITERS (si tu utilises framework.rate_limiter)
    # ============================================================
    rate_limiter:
        register:
            policy: "fixed_window"
            limit: 10
            interval: "10 minutes"

        login:
            policy: "sliding_window"
            limit: 20
            interval: "10 minutes"

        verify_code:
            policy: "fixed_window"
            limit: 10
            interval: "10 minutes"

        resend_code:
            policy: "fixed_window"
            limit: 3
            interval: "30 minutes"

        reset_request:
            policy: "fixed_window"
            limit: 5
            interval: "30 minutes"

        reset_final:
            policy: "fixed_window"
            limit: 5
            interval: "30 minutes"

        set_password:
            policy: "fixed_window"
            limit: 10
            interval: "30 minutes"

        # ✅ OAuth Google callback flood protection
        google_oauth_check:
            policy: "fixed_window"
            limit: 20
            interval: "10 minutes"

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
