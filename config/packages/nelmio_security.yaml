nelmio_security:
    clickjacking:
        paths:
            "^/.*": DENY

    content_type:
        nosniff: true

    referrer_policy:
        enabled: true
        policies:
            - no-referrer
            - strict-origin-when-cross-origin

    csp:
        enabled: true
        content_types:
            - text/html
        compat_headers: false

        enforce:
            default-src:
                - "'self'"

            script-src:
                - "'self'"
                - "nonce"
                - "'unsafe-eval'"
                - https://cdnjs.cloudflare.com
                - https://cdn.jsdelivr.net
                - https://unpkg.com
                - https://challenges.cloudflare.com
                - https://*.cloudflare.com
                - https://cloudflare.com
                - https://stackpath.bootstrapcdn.com
                - https://maxcdn.bootstrapcdn.com
                - https://maps.googleapis.com
                - https://maps.gstatic.com
                - https://www.google.com
                - https://cdn.tiny.cloud

            style-src:
                - "'self'"
                - "nonce"
                - https://fonts.googleapis.com
                - https://cdnjs.cloudflare.com
                - https://cdn.jsdelivr.net
                - https://unpkg.com
                - https://stackpath.bootstrapcdn.com
                - https://maxcdn.bootstrapcdn.com

            font-src:
                - "'self'"
                - "data:"
                - https://cdnjs.cloudflare.com
                - https://fonts.gstatic.com
                - https://stackpath.bootstrapcdn.com
                - https://maxcdn.bootstrapcdn.com
                - https://cdn.jsdelivr.net
                - https://unpkg.com

            img-src:
                - "'self'"
                - "data:"
                - "blob:"
                - https://chart.googleapis.com
                - https://api.qrserver.com
                - https://ui-avatars.com
                - https://challenges.cloudflare.com
                - https://*.cloudflare.com
                - https://cdn.jsdelivr.net
                - https://maps.gstatic.com
                - https://maps.googleapis.com
                - https://www.google.com
                - https://*.svgrepo.com
                - https://cdn-s-www.bienpublic.com
                - https://www.ffhaltero.fr
                - https://gazettesports.fr
                - https://flagcdn.com

            connect-src:
                - "'self'"
                - https://cdn.jsdelivr.net
                - https://challenges.cloudflare.com
                - https://*.cloudflare.com
                - https://client-api.arkoselabs.com
                - https://www.google-analytics.com
                - https://cloudflareinsights.com
                - https://www.gstatic.com
                - https://maps.googleapis.com
                - https://maps.gstatic.com
                - https://www.google.com
                - https://unpkg.com

            frame-src:
                - https://challenges.cloudflare.com
                - https://www.google.com

            object-src:
                - "'none'"

            base-uri:
                - "'self'"

            # ✅ Couvre les workers Cloudflare Turnstile
            worker-src:
                - "'self'"
                - https://challenges.cloudflare.com
                - https://*.cloudflare.com

            # ✅ Couvre les iframes enfants Cloudflare
            child-src:
                - "'self'"
                - https://challenges.cloudflare.com
                - https://*.cloudflare.com

            # ✅ Empêche les formulaires de soumettre vers des domaines externes
            form-action:
                - "'self'"

            # ✅ Pas de workers locaux
            manifest-src:
                - "'self'"
