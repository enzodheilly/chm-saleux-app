nelmio_security:
    clickjacking:
        paths:
            "^/.*": DENY

    content_type:
        nosniff: true

    referrer_policy:
        enabled: true
        policies:
            - no-referrer
            - strict-origin-when-cross-origin

    csp:
        enabled: true
        content_types:
            - text/html
        compat_headers: false

        enforce:
            default-src:
                - "'self'"

            script-src:
                - "'self'"
                - "nonce"
                - https://cdnjs.cloudflare.com
                - https://cdn.jsdelivr.net
                - https://challenges.cloudflare.com
                - https://*.cloudflare.com
                - https://cloudflare.com
                - https://maps.googleapis.com
                - https://maps.gstatic.com
                - https://www.google.com

            style-src:
                - "'self'"
                - "nonce"
                - https://cdnjs.cloudflare.com
                - https://cdn.jsdelivr.net

            font-src:
                - "'self'"
                - "data:"
                - https://cdnjs.cloudflare.com

            img-src:
                - "'self'"
                - "data:"
                - "blob:"
                - https://chart.googleapis.com
                - https://challenges.cloudflare.com
                - https://*.cloudflare.com
                - https://cdn.jsdelivr.net
                - https://maps.gstatic.com
                - https://maps.googleapis.com
                - https://www.google.com
                - https://flagcdn.com

            connect-src:
                - "'self'"
                - https://cdn.jsdelivr.net
                - https://challenges.cloudflare.com
                - https://*.cloudflare.com
                - https://www.gstatic.com
                - https://maps.googleapis.com
                - https://maps.gstatic.com
                - https://www.google.com
                - https://ipapi.co

            frame-src:
                - https://challenges.cloudflare.com
                - https://www.google.com

            object-src:
                - "'none'"

            base-uri:
                - "'self'"

            # ✅ Couvre les workers Cloudflare Turnstile
            worker-src:
                - "'self'"
                - https://challenges.cloudflare.com
                - https://*.cloudflare.com

            # ✅ Couvre les iframes enfants Cloudflare
            child-src:
                - "'self'"
                - https://challenges.cloudflare.com
                - https://*.cloudflare.com

            # ✅ Empêche les formulaires de soumettre vers des domaines externes
            form-action:
                - "'self'"

            # ✅ Pas de workers locaux
            manifest-src:
                - "'self'"
